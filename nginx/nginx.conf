events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Redirect all HTTP to HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    
    # server {
    #     listen 443 ssl;
    #     server_name CLIENT_DOMAIN_PLACEHOLDER;

    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;

    #     location / {
    #         proxy_pass http://dashboard:3000;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     }
    # }

    # Backend (API)
    server {
        listen 443 ssl;
        server_name API_DOMAIN_PLACEHOLDER;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Health check / Fallback for root
        location / {
            default_type application/json;
            return 200 '{"status":"ok","message":"API is running"}';
        }

        # Ingestion API (Discord Interactions)
        location = /api/interactions {
            # Route GET requests to main API
            error_page 418 = @api_interactions;
            if ($request_method = GET) {
                return 418;
            }
            
            # Route POST requests to ingestion
            proxy_pass http://ingestion:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location @api_interactions {
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Internal Worker API (Optional to expose)
        location /api/worker {
            proxy_pass http://bot:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Core API
        location /api/ {
            proxy_pass http://api:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # For SSE (Server-Sent Events) on /api/logs/stream
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
