name: Build and Push Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/automate

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Optional: use environment variables for dashboard build time
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-api --all-tags

      - name: Build and push Ingestion image
        run: |
          docker build -f apps/ingestion/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-ingestion:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-ingestion:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-ingestion --all-tags

      - name: Build and push Bot Worker image
        run: |
          docker build -f apps/bot/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-bot:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-bot:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-bot --all-tags

      # - name: Build and push Dashboard image
      #   env:
      #     NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      #   run: |
      #     docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -f apps/dashboard/Dockerfile.prod -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-dashboard:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-dashboard:${{ github.sha }} .
      #     docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-dashboard --all-tags
